<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC26 Receptions & Socials</title>
<meta name="description" content="Community guide to receptions, parties, and networking socials during SC26 (Chicago, Nov 15–20, 2026) — with map pins and registration links.">
<meta property="og:title" content="SC26 Receptions & Socials">
<meta property="og:description" content="Receptions, parties & happy hours during SC26 week in Chicago — by day, on a map, with registration links.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ec; --text: #1c1c1a; --muted: #62625d;
  --border: #e2e2dc; --accent: #2b59c3; --accent-soft: #e5ecfb; --accent-text: #ffffff;
  --official: #6941c6; --official-soft: #efe9fb; --bad: #b42318; --bad-soft: #fdecea;
  --good: #067647; --good-soft: #e3f6ec; --warn: #9a6700; --warn-soft: #fff4d6;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.03);
  --pin: #d1432f; --pin-home: #2b59c3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --surface: #1b1b1a; --surface-2: #242422; --text: #ececea; --muted: #a3a39d;
    --border: #2f2f2c; --accent: #7aa2f7; --accent-soft: #1f2a44; --accent-text: #0f1420;
    --official: #b69cf7; --official-soft: #2a2140; --bad: #f97066; --bad-soft: #3a1d1a;
    --good: #47cd89; --good-soft: #15291f; --warn: #f5c451; --warn-soft: #33290f;
    --shadow: none; --pin: #ff7a66; --pin-home: #7aa2f7;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

header.top { padding-top: 28px; padding-bottom: 8px; }
header.top h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.01em; }
.intro { color: var(--muted); max-width: 820px; }
.intro p { margin: 4px 0; }
.intro strong { color: var(--text); }
.intro sub { vertical-align: baseline; font-size: 12px; color: var(--muted); }
.intro p:has(> sub:only-child) { margin: 0 0 8px; }
details.notes { margin-top: 10px; max-width: 820px; }
details.notes summary { cursor: pointer; color: var(--muted); font-size: 14px; }
details.notes ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }

.controls {
  position: sticky; top: 0; z-index: 1000; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.controls .wrap { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-top: 10px; padding-bottom: 10px; }
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
.days::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.chip .n { opacity: .7; font-size: 12px; margin-left: 4px; }
.tools { display: flex; gap: 10px; align-items: center; flex: 0 1 auto; min-width: 0; }
.search {
  width: 220px; max-width: 100%; min-width: 0; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 14px;
}
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); white-space: nowrap; cursor: pointer; }

main.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding-top: 16px; padding-bottom: 24px; }
#mapcol { position: sticky; top: 64px; height: calc(100vh - 80px); align-self: start; }
#map { height: 100%; width: 100%; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); }
.count { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
h2.day { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 650; }
h2.day:first-of-type { margin-top: 4px; }
h2.day em { text-transform: none; letter-spacing: 0; font-weight: 400; }

#listcol, #mapcol { min-width: 0; }
.card {
  overflow-wrap: anywhere;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  box-shadow: var(--shadow); scroll-margin-top: 80px; transition: border-color .2s, box-shadow .2s;
}
.card.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card.ended { opacity: .55; }
.card .row1 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 2px; }
.time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.official { background: var(--official-soft); color: var(--official); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
.card h3 { font-size: 17px; line-height: 1.3; margin: 2px 0 2px; }
.host { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.meta { display: grid; grid-template-columns: 22px 1fr; gap: 4px 6px; font-size: 14px; }
.meta .ic { text-align: center; }
.meta em { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; }
.actions button, .actions a { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.actions button:hover { text-decoration: underline; }
.card { position: relative; }
.card .row1 { padding-right: 30px; }
.star { position: absolute; top: 6px; right: 6px; border: 0; background: none; padding: 6px; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; }
.star[aria-pressed="true"] { color: #e3a008; }
.num, .stop { background: var(--accent); color: var(--accent-text); border-radius: 999px; font-weight: 700; font-size: 11px; text-align: center; }
.num { display: inline-block; min-width: 20px; padding: 1px 6px; line-height: 18px; }
.stop { display: flex; align-items: center; justify-content: center; width: auto !important; min-width: 22px; padding: 0 5px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); white-space: nowrap; }
.leg { font-size: 13px; color: var(--muted); margin: -2px 0 8px 14px; }
.leg.bad { color: var(--warn); }
.planbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; font-size: 13px; }
.planbar button, .planbar a { font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--accent); border-radius: 8px; padding: 5px 10px; cursor: pointer; text-decoration: none; }
dialog.review { width: min(560px, calc(100vw - 32px)); max-height: 85vh; padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); }
dialog.review::backdrop { background: rgba(0,0,0,.45); }
.review header { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
.review header button { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; }
.review .giscus { padding: 10px 14px 14px; min-height: 180px; }
.note { color: var(--muted); font-size: 14px; margin: 10px 0; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

section.more { border-top: 1px solid var(--border); padding-top: 8px; }
section.more h2 { font-size: 20px; margin: 26px 0 8px; }
section.more ul, section.more ol { padding-left: 22px; }
section.more li { margin: 4px 0; }
section.more code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
section.more hr { display: none; }
section.more sub { color: var(--muted); font-size: 13px; display: block; margin-top: 24px; }

.leaflet-container { font: inherit; }
.leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.45; }
.leaflet-popup-content b { font-size: 14px; }
.leaflet-popup-content ul { margin: 6px 0 0; padding-left: 16px; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--text); }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.leaflet-control-attribution { font-size: 10px; }
.basemap { filter: saturate(.35) contrast(.95); }
@media (prefers-color-scheme: dark) {
  .basemap { filter: invert(1) hue-rotate(180deg) saturate(.3) brightness(.85) contrast(.9); }
  .leaflet-control-attribution { background: rgba(27,27,26,.8) !important; color: var(--muted); }
  .leaflet-bar a { background: var(--surface); color: var(--text); border-color: var(--border); }
}

.status { padding: 40px 0; color: var(--muted); }

@media (max-width: 900px) {
  main.grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  #mapcol { position: relative; top: 0; height: 42vh; min-height: 260px; order: -1; }
  .tools { width: 100%; }
  .card { scroll-margin-top: 130px; }
  .search { flex: 1 1 auto; width: auto; }
  header.top { padding-top: 20px; }
  header.top h1 { font-size: 22px; }
}
</style>
</head>
<body>
<header class="top wrap">
  <h1 id="title">SC26 Receptions &amp; Social Events</h1>
  <div class="intro" id="intro"></div>
</header>

<nav class="controls" aria-label="Filters">
  <div class="wrap">
    <div class="days" id="days" role="group" aria-label="Day"></div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Search: AMD, NVIDIA, museum…" aria-label="Search events">
      <label class="toggle"><input type="checkbox" id="hideClosed"> Hide sold out</label>
    </div>
  </div>
</nav>

<main class="wrap grid">
  <div id="listcol">
    <p class="count" id="count"></p>
    <div id="list"><p class="status">Loading events…</p></div>
    <div id="notes"></div>
  </div>
  <div id="mapcol"><div id="map" role="region" aria-label="Map of venues"></div></div>
</main>

<section class="wrap more" id="more"></section>

<dialog class="review" id="review"><header><b id="reviewTitle"></b><button type="button" id="reviewClose" aria-label="Close">×</button></header><div id="reviewBox"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(() => {
  "use strict";
  // Everything on this page is read from README.md and venues.geojson in this repo.
  // Edit those files; this page only renders them.
  const README = "README.md", GEOJSON = "venues.geojson";
  const UTC_OFFSET_HOURS = 6; // Chicago is CST (UTC−6) for all of SC26 week
  const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
  const $ = (s) => document.querySelector(s);

  const md = (s) => DOMPurify.sanitize(marked.parse(s));
  const mdi = (s) => DOMPurify.sanitize(marked.parseInline(s));
  const plain = (s) => { const d = document.createElement("div"); d.innerHTML = mdi(s); return d.textContent.replace(/\s+/g, " ").trim(); };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const slug = (s) => s.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
  const externalLinks = (root) => root.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });

  // ---------- parse README ----------
  function splitRow(line) {
    return line.trim().replace(/^\|/, "").replace(/\|$/, "").split(/(?<!\\)\|/).map((c) => c.trim());
  }
  function parseReadme(text) {
    const lines = text.split(/\r?\n/);
    const start = lines.findIndex((l) => /^## .*Day by day/i.test(l));
    if (start < 0) throw new Error("Couldn't find the “Day by day” section in README.md");
    let end = lines.findIndex((l, i) => i > start && /^## /.test(l));
    if (end < 0) end = lines.length;
    const yearMatch = text.match(/\b(20\d\d)\b/);
    const year = yearMatch ? +yearMatch[1] : new Date().getFullYear();

    const days = [], notes = [];
    let day = null;
    for (const raw of lines.slice(start + 1, end)) {
      const line = raw.trim();
      const h = line.match(/^### (\w+),\s*([A-Za-z]{3})\w*\.?\s+(\d{1,2})(.*)$/);
      if (h) {
        day = { weekday: h[1], key: h[1].slice(0, 3), month: MONTHS[h[2]], date: +h[3], suffix: h[4].replace(/^\s*[—-]\s*/, ""), events: [] };
        days.push(day);
        continue;
      }
      if (line.startsWith("|")) {
        const c = splitRow(line);
        if (!day || c.length < 5 || /^-+$/.test(c[0].replace(/[:\s]/g, "")) || /^time$/i.test(c[0])) continue;
        day.events.push(makeEvent(day, year, c));
        continue;
      }
      if (/^\*.+\*$/.test(line)) notes.push(line);
    }
    const intro = lines.slice(0, start).filter((l) => !/^# /.test(l) && !/^---\s*$/.test(l) && !/(github\.io\/sc26-receptions|venues\.geojson)/.test(l)).join("\n");
    const title = (lines.find((l) => /^# /.test(l)) || "").replace(/^# /, "");
    const more = lines.slice(end).join("\n");
    return { title, intro, days, notes, more, year };
  }

  function makeEvent(day, year, [time, name, host, venue, reg]) {
    const t = time.match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);
    let start = null, end = null;
    if (t) {
      start = Date.UTC(year, day.month, day.date, +t[1] + UTC_OFFSET_HOURS, +t[2]);
      end = Date.UTC(year, day.month, day.date, +t[3] + UTC_OFFSET_HOURS, +t[4]);
      if (end <= start) end += 24 * 3600e3;
    }
    const link = venue.match(/\[([^\]]+)\]\(([^)\s]+)\)/);
    const venueParts = venue.split(/<br\s*\/?>/i).map((s) => s.trim());
    const venueName = plain(link ? link[1] : venueParts[0]).replace(/^📍\s*/, "");
    const venueExtra = venueParts.slice(1).map(plain).filter(Boolean);
    const all = `${name} ${host} ${venue} ${reg}`;
    return {
      id: `ev-${day.key.toLowerCase()}-${slug(plain(name)).slice(0, 40)}-${time.slice(0, 5).replace(":", "")}`,
      day, time: time.replace(/\s*⭐/g, ""), name, host, venue, reg, start, end,
      mapUrl: link ? link[2] : null, venueName, venueExtra,
      text: plain(all).toLowerCase(),
      official: /\(official\)/i.test(name),
      closed: /❌/.test(reg),
      unverified: /⚠️/.test(reg),
      approval: /invit|approval|request|confirm/i.test(reg),
      badgeOnly: /badge only|included with|badge \+|badge is enough/i.test(reg),
      walkup: /walk-?up|walk-?in/i.test(reg),
      noLink: !/\]\(http/.test(reg),
    };
  }

  // ---------- calendar ----------
  const icsDate = (ms) => new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const icsEsc = (s) => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  function firstUrl(s) { const m = s.match(/\]\((https?:[^)\s]+)\)/); return m ? m[1] : ""; }
  function venueLocation(ev) { return [ev.venueName, ...ev.venueExtra].join(", ").replace(/\s*\(pin from[^)]*\)/i, "") + ", Chicago, IL"; }
  function details(ev) {
    const url = firstUrl(ev.reg);
    return [plain(ev.host), "Registration: " + plain(ev.reg) + (url ? ` ${url}` : ""), "From the SC26 receptions guide: " + window.location.href.split("#")[0]].join("\n");
  }
  function vevent(ev) {
    return [
      "BEGIN:VEVENT", `UID:${ev.id}@sc26-receptions`, `DTSTAMP:${icsDate(Date.now())}`, `DTSTART:${icsDate(ev.start)}`, `DTEND:${icsDate(ev.end)}`,
      `SUMMARY:${icsEsc(plain(ev.name))}`, `LOCATION:${icsEsc(venueLocation(ev))}`, `DESCRIPTION:${icsEsc(details(ev))}`,
      ...(firstUrl(ev.reg) ? [`URL:${firstUrl(ev.reg)}`] : []), "END:VEVENT",
    ];
  }
  function icsHref(evs) {
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//sc26-receptions//EN", "CALSCALE:GREGORIAN",
      ...[].concat(evs).filter((e) => e.start).flatMap(vevent), "END:VCALENDAR", ""].join("\r\n");
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  }
  function gcalHref(ev) {
    const p = new URLSearchParams({ action: "TEMPLATE", text: plain(ev.name), dates: `${icsDate(ev.start)}/${icsDate(ev.end)}`, location: venueLocation(ev), details: details(ev) });
    return "https://calendar.google.com/calendar/render?" + p.toString();
  }

  // ---------- map ----------
  let map, pins = [];
  function initMap(geo, events) {
    map = L.map("map", { scrollWheelZoom: false, zoomControl: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, className: "basemap",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    const css = getComputedStyle(document.documentElement);
    const color = (home) => css.getPropertyValue(home ? "--pin-home" : "--pin").trim();

    for (const f of (geo && geo.features) || []) {
      if (!f.geometry || f.geometry.type !== "Point") continue;
      const [lon, lat] = f.geometry.coordinates, p = f.properties || {};
      const home = /McCormick Place/i.test(p.venue || "");
      const marker = L.circleMarker([lat, lon], { radius: 8, weight: 2, color: "#fff", fillColor: color(home), fillOpacity: .95 }).addTo(map);
      const pin = { marker, props: p, home, events: [] };
      pins.push(pin);
      marker.bindTooltip(esc(p.venue || ""), { direction: "top", offset: [0, -6] });
      marker.on("click", () => openPin(pin));
    }
    // attach each README event to a pin: same Google Maps link first, then by name
    const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    for (const ev of events) {
      let pin = ev.mapUrl && pins.find((p) => p.props.google_maps === ev.mapUrl);
      if (!pin) {
        const n = norm(ev.venueName);
        pin = n && pins.find((p) => { const v = norm(p.props.venue); return v && (v.startsWith(n) || n.startsWith(v)); });
      }
      if (pin) { ev.pin = pin; pin.events.push(ev); }
    }
    fitTo(pins);
  }
  function fitTo(list) {
    const pts = list.map((p) => p.marker.getLatLng());
    if (!pts.length) { map.setView([41.86, -87.63], 12); return; }
    map.fitBounds(L.latLngBounds(pts), { padding: [28, 28], maxZoom: 15 });
  }
  function popupHtml(pin) {
    const p = pin.props;
    const evs = pin.events.filter(visible);
    const items = (evs.length ? evs : pin.events).map((e) =>
      `<li><a href="#${e.id}" data-jump="${e.id}">${esc(e.day.key)} ${esc(e.time)} · ${esc(plain(e.name))}</a></li>`).join("");
    const gm = p.google_maps ? ` · <a href="${esc(p.google_maps)}" target="_blank" rel="noopener">Open in Google Maps</a>` : "";
    const fallback = !items && p.events ? `<ul>${String(p.events).split(" | ").map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
    return `<b>${esc(p.venue || "")}</b><br>${esc(p.address || "")}${gm}${items ? `<ul>${items}</ul>` : fallback}`;
  }
  function openPin(pin, zoom) {
    if (zoom) map.flyTo(pin.marker.getLatLng(), Math.max(map.getZoom(), 15), { duration: .6 });
    pin.marker.bindPopup(popupHtml(pin), { maxWidth: 280 }).openPopup();
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-jump]");
    if (!a) return;
    e.preventDefault();
    const card = document.getElementById(a.dataset.jump);
    if (!card) { state.day = "all"; state.q = ""; $("#q").value = ""; render(); }
    flash(a.dataset.jump);
  });
  function flash(id) {
    const card = document.getElementById(id);
    if (!card) return;
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.add("flash");
    setTimeout(() => card.classList.remove("flash"), 1600);
  }

  // ---------- my plan (stored only in this browser) ----------
  const PLAN_KEY = "sc26-plan";
  let stars = new Set(), shared = new Set();
  try { stars = new Set(JSON.parse(localStorage.getItem(PLAN_KEY) || "[]")); } catch (_) {}
  const saveStars = () => { try { localStorage.setItem(PLAN_KEY, JSON.stringify([...stars])); } catch (_) {} };
  const inPlanView = () => state.day === "plan" || state.day === "shared";
  const planSet = () => (state.day === "shared" ? shared : stars);
  const short = (id) => id.replace(/^ev-/, "");
  function readSharedFromHash() {
    const m = location.hash.match(/^#plan=([^&]+)/);
    return m ? new Set(decodeURIComponent(m[1]).split(",").filter(Boolean).map((s) => "ev-" + s)) : new Set();
  }
  function km(a, b) {
    const R = 6371, r = Math.PI / 180, x = a.lat * r, y = b.lat * r;
    const h = Math.sin((y - x) / 2) ** 2 + Math.cos(x) * Math.cos(y) * Math.sin(((b.lng - a.lng) * r) / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  // Travel between consecutive picks (rough: walk ≤1.2 km at 5 km/h, else car at 25 km/h + 8 min).
  // "⚠ conflict" only when you can't spend ~30 min at each after travel; overlapping parties are normal.
  const STAY = 30 * 60e3;
  function legs(evs) {
    const out = [""];
    let arrive = evs[0] && evs[0].start;
    for (let i = 1; i < evs.length; i++) {
      const a = evs[i - 1], b = evs[i];
      if (!a.pin || !b.pin || !a.end || !b.start || !arrive) { out.push(""); arrive = b.start; continue; }
      const d = km(a.pin.marker.getLatLng(), b.pin.marker.getLatLng());
      const walk = d <= 1.2, mins = a.pin === b.pin ? 0 : walk ? Math.max(2, Math.round((d / 5) * 60)) : Math.round((d / 25) * 60 + 8);
      const leave = arrive + Math.max(0, Math.min(STAY, a.end - arrive));
      const next = Math.max(b.start, leave + mins * 60e3);
      const conflict = next > b.end - STAY;
      const travel = mins ? `${walk ? "🚶" : "🚕"} ~${mins} min` : "Same venue";
      out.push(`<p class="leg${conflict ? " bad" : ""}">↓ ${travel}${conflict ? " · ⚠ conflict" : b.start < a.end ? " · overlaps" : ""}</p>`);
      arrive = next;
    }
    return out;
  }
  let route = null;

  // ---------- reviews (giscus → GitHub Discussions, one thread per event) ----------
  const GISCUS = { repo: "binkma-v/sc26-receptions", "repo-id": "R_kgDOVrLOWA", category: "Announcements", "category-id": "DIC_kwDOVrLOWM4DK7tE" };
  const nowMs = () => { const p = new URLSearchParams(location.search).get("now"); return (p && Date.parse(p)) || Date.now(); }; // ?now= lets you preview
  function openReview(ev) {
    $("#reviewTitle").textContent = plain(ev.name);
    const box = $("#reviewBox");
    box.innerHTML = '<div class="giscus"></div>';
    const s = document.createElement("script");
    s.src = "https://giscus.app/client.js"; s.async = true; s.crossOrigin = "anonymous";
    Object.entries({ ...GISCUS, mapping: "specific", term: `${plain(ev.name)} · ${ev.day.key} ${ev.time}`, strict: "1",
      "reactions-enabled": "1", "emit-metadata": "0", "input-position": "top", theme: "preferred_color_scheme", lang: "en" })
      .forEach(([k, v]) => s.setAttribute("data-" + k, v));
    box.appendChild(s);
    $("#review").showModal();
  }

  // ---------- state & render ----------
  const state = { day: "all", q: "", hideClosed: false };
  let DATA = null;
  const visible = (ev) =>
    (state.day === "all" || ev.day.key === state.day || (inPlanView() && planSet().has(ev.id))) &&
    (!inPlanView() || planSet().has(ev.id)) &&
    (!state.hideClosed || !ev.closed) &&
    (!state.q || state.q.split(/\s+/).every((w) => ev.text.includes(w)));

  function badges(ev, now) {
    const b = [];
    if (ev.start && now >= ev.start && now < ev.end) b.push(`<span class="badge good">● Happening now</span>`);
    if (ev.unverified) b.push(`<span class="badge warn">⚠ Unverified</span>`);
    if (ev.official) b.push(`<span class="badge official">Official SC26</span>`);
    if (ev.closed) b.push(`<span class="badge bad">Sold out / closed</span>`);
    else if (ev.badgeOnly) b.push(`<span class="badge">Badge</span>`);
    else if (ev.walkup) b.push(`<span class="badge">Walk-up</span>`);
    if (!ev.closed && ev.approval) b.push(`<span class="badge acc">Invite / approval</span>`);
    return b.join("");
  }

  function card(ev, now, n) {
    const ended = ev.end && now > ev.end;
    const venueLine = ev.mapUrl
      ? `<a href="${esc(ev.mapUrl)}" target="_blank" rel="noopener">${esc(ev.venueName)}</a>`
      : esc(ev.venueName);
    const extra = ev.venueExtra.length ? `<br><em>${ev.venueExtra.map(esc).join(" · ")}</em>` : "";
    const cal = ev.start
      ? `<a href="${gcalHref(ev)}" target="_blank" rel="noopener">+ Google Calendar</a><a href="${icsHref(ev)}" download="${ev.id}.ics">+ Apple / Outlook (.ics)</a>`
      : "";
    const mapBtn = (ev.start && now >= ev.start ? `<button type="button" data-review="${ev.id}">★ Review</button>` : "") +
      (ev.pin ? `<button type="button" data-pin="${ev.id}">Show on map</button>` : "");
    const on = stars.has(ev.id);
    return `<article class="card${ended ? " ended" : ""}" id="${ev.id}">
      <button type="button" class="star" data-star="${ev.id}" aria-pressed="${on}" aria-label="${on ? "Remove from" : "Add to"} my plan">${on ? "★" : "☆"}</button>
      <div class="row1">${n ? `<span class="num">${n}</span>` : ""}<span class="time">${esc(ev.time)}</span>${badges(ev, now)}</div>
      <h3>${mdi(ev.name)}</h3>
      <p class="host">${mdi(ev.host)}</p>
      <div class="meta">
        <span class="ic" aria-hidden="true">📍</span><div>${venueLine}${extra}</div>
        <span class="ic" aria-hidden="true">🎟️</span><div>${mdi(ev.reg)}</div>
      </div>
      <div class="actions">${mapBtn}${cal}</div>
    </article>`;
  }

  function render(refit = true) {
    const now = nowMs();
    const list = $("#list");
    let html = "", shown = 0;
    const planEvs = [], order = new Map();
    if (inPlanView()) DATA.days.flatMap((d) => d.events).filter(visible).forEach((e, i) => order.set(e.id, i + 1));
    for (const d of DATA.days) {
      const evs = d.events.filter(visible);
      if (!evs.length) continue;
      shown += evs.length;
      planEvs.push(evs);
      const mon = Object.keys(MONTHS)[d.month];
      html += `<h2 class="day">${esc(d.weekday)}, ${mon} ${d.date}${d.suffix ? ` — ${mdi(d.suffix)}` : ""}</h2>`;
      const lg = inPlanView() ? legs(evs) : [];
      html += evs.map((e, i) => (lg[i] || "") + card(e, now, order.get(e.id))).join("");
    }
    let bar = "";
    if (state.day === "shared") {
      bar = `<div class="planbar"><b>Shared plan</b><button type="button" data-plan="import">★ Add to my plan</button><button type="button" data-plan="close">Close</button></div>`;
    } else if (state.day === "plan" && stars.size) {
      bar = `<div class="planbar"><button type="button" data-plan="share">Share link</button><a href="${icsHref(planEvs.flat())}" download="sc26-plan.ics">Add all to calendar</a></div>`;
    }
    const empty = state.day === "plan" ? "Tap ☆ on any event to add it to your plan." : "No events match. Try another day or clear the search.";
    list.innerHTML = bar + (html || `<p class="empty">${empty}</p>`);
    externalLinks(list);
    const total = DATA.days.reduce((n, d) => n + d.events.length, 0);
    $("#count").textContent = inPlanView() ? (state.day === "shared" ? `${shown} in shared plan` : `${shown} in your plan · saved in this browser only`) : shown === total ? `${total} events` : `${shown} of ${total} events`;
    $("#notes").innerHTML = state.day === "all" && !state.q ? DATA.notes.map((n) => `<p class="note">${mdi(n)}</p>`).join("") : "";
    externalLinks($("#notes"));
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.day === state.day)));
    const pc = $("#planCount"); if (pc) pc.textContent = stars.size || "";

    // route: plan events in time order, one line per day
    if (map) {
      if (route) { route.remove(); route = null; }
      if (inPlanView()) {
        const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
        const lines = planEvs.map((evs) => evs.filter((e) => e.pin).map((e) => e.pin.marker.getLatLng())
          .filter((p, i, a) => !i || !p.equals(a[i - 1]))).filter((l) => l.length > 1);
        const byPin = new Map();
        planEvs.flat().filter((e) => e.pin).forEach((e) => byPin.set(e.pin, [...(byPin.get(e.pin) || []), order.get(e.id)]));
        route = L.layerGroup([
          L.polyline(lines, { color: accent, weight: 3, opacity: .85, dashArray: "6 6", interactive: false }),
          ...[...byPin].map(([pin, nums]) => L.marker(pin.marker.getLatLng(), {
            icon: L.divIcon({ className: "stop", html: nums.join(","), iconSize: [22, 22], iconAnchor: [11, 11] }),
            keyboard: false, zIndexOffset: 1000,
          }).on("click", () => openPin(pin))),
        ]).addTo(map);
      }
    }

    // pins: emphasize venues with visible events
    if (map) {
      const active = [];
      for (const p of pins) {
        const on = p.events.some(visible) || (!p.events.length && state.day === "all" && !state.q);
        p.marker.setStyle({ fillOpacity: on ? .95 : .18, opacity: on ? 1 : .3, radius: on ? 8 : 6 });
        if (on) { p.marker.bringToFront(); active.push(p); }
      }
      if (refit) { map.closePopup(); fitTo(active.length ? active : pins); }
    }
  }

  function buildChips() {
    const chips = [`<button class="chip" data-day="plan">★ Plan<span class="n" id="planCount"></span></button>`, `<button class="chip" data-day="all">All days</button>`].concat(
      DATA.days.map((d) => `<button class="chip" data-day="${d.key}">${d.key} ${d.date}<span class="n">${d.events.length}</span></button>`));
    $("#days").innerHTML = chips.join("");
    $("#days").addEventListener("click", (e) => {
      const b = e.target.closest(".chip"); if (!b) return;
      state.day = b.dataset.day; save(); render();
    });
  }

  function chicagoToday() {
    const now = new Date(nowMs() - UTC_OFFSET_HOURS * 3600e3);
    return { month: now.getUTCMonth(), date: now.getUTCDate(), year: now.getUTCFullYear() };
  }
  function save() { try { localStorage.setItem("sc26-filters", JSON.stringify({ day: state.day, hideClosed: state.hideClosed })); } catch (_) {} }
  function restore() {
    try { const s = JSON.parse(localStorage.getItem("sc26-filters") || "null"); if (s) { state.day = s.day || "all"; state.hideClosed = !!s.hideClosed; } } catch (_) {}
    const t = chicagoToday(); // during SC26 week, open on today's tab
    const today = DATA.days.find((d) => d.month === t.month && d.date === t.date && DATA.year === t.year);
    if (today && state.day !== "plan") state.day = today.key;
    if (state.day !== "plan" && !DATA.days.some((d) => d.key === state.day)) state.day = "all";
    if (state.day === "plan" && !stars.size) state.day = "all";
    shared = readSharedFromHash();
    if (shared.size) state.day = "shared";
    $("#hideClosed").checked = state.hideClosed;
  }

  async function main() {
    try {
      const [readme, geo] = await Promise.all([
        fetch(README, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(`README.md: HTTP ${r.status}`); return r.text(); }),
        fetch(GEOJSON, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      ]);
      DATA = parseReadme(readme);
      const events = DATA.days.flatMap((d) => d.events);

      if (DATA.title) { $("#title").innerHTML = mdi(DATA.title); document.title = plain(DATA.title).replace(/^\W+/, ""); }
      const introHtml = md(DATA.intro);
      const tmp = document.createElement("div"); tmp.innerHTML = introHtml;
      const ul = tmp.querySelector("ul");
      if (ul) {
        const label = ul.previousElementSibling && /notes/i.test(ul.previousElementSibling.textContent) ? ul.previousElementSibling : null;
        const det = document.createElement("details"); det.className = "notes";
        det.innerHTML = `<summary>${label ? label.textContent : "Notes"}</summary>`;
        det.appendChild(ul);
        if (label) label.replaceWith(det); else tmp.appendChild(det);
      }
      $("#intro").innerHTML = ""; $("#intro").append(...tmp.childNodes);
      externalLinks($("#intro"));

      const more = $("#more");
      more.innerHTML = md(DATA.more);
      more.querySelectorAll("h2, h3").forEach((h) => { h.id = slug(h.textContent); });
      externalLinks(more);

      initMap(geo, events);
      restore();
      buildChips();
      render();

      $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
      $("#hideClosed").addEventListener("change", (e) => { state.hideClosed = e.target.checked; save(); render(); });
      $("#reviewClose").addEventListener("click", () => $("#review").close());
      $("#review").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
      $("#list").addEventListener("click", async (e) => {
        const r = e.target.closest("[data-review]");
        if (r) { const ev = events.find((x) => x.id === r.dataset.review); if (ev) openReview(ev); return; }
        const s = e.target.closest("[data-star]");
        if (s) {
          const id = s.dataset.star;
          stars.has(id) ? stars.delete(id) : stars.add(id);
          saveStars(); render(false); return;
        }
        const p = e.target.closest("[data-plan]");
        if (p) {
          const act = p.dataset.plan;
          if (act === "share") {
            const ids = DATA.days.flatMap((d) => d.events).filter((x) => stars.has(x.id)).map((x) => short(x.id));
            const url = `${location.origin}${location.pathname}#plan=${ids.join(",")}`;
            try {
              if (navigator.share && matchMedia("(pointer: coarse)").matches) await navigator.share({ title: "My SC26 plan", url });
              else { await navigator.clipboard.writeText(url); p.textContent = "Link copied ✓"; setTimeout(() => (p.textContent = "Share link"), 1500); }
            } catch (_) { window.prompt("Copy this link:", url); }
            return;
          }
          if (act === "import") shared.forEach((id) => stars.add(id)), saveStars();
          history.replaceState(null, "", location.pathname + location.search);
          shared = new Set(); state.day = act === "import" ? "plan" : "all"; save(); render();
          return;
        }
        const b = e.target.closest("[data-pin]"); if (!b) return;
        const ev = events.find((x) => x.id === b.dataset.pin);
        if (!ev || !ev.pin) return;
        if (matchMedia("(max-width: 900px)").matches) $("#mapcol").scrollIntoView({ behavior: "smooth", block: "start" });
        openPin(ev.pin, true);
      });
      window.addEventListener("hashchange", () => { const s = readSharedFromHash(); if (s.size) { shared = s; state.day = "shared"; render(); } });
      setInterval(() => render(false), 5 * 60e3); // refresh "happening now" during the week
      if (location.hash) setTimeout(() => { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }, 50);
    } catch (err) {
      console.error(err);
      $("#list").innerHTML = `<p class="status">Couldn't load the event list (${esc(err.message)}). <a href="https://github.com/binkma-v/sc26-receptions#readme">View it on GitHub instead →</a></p>`;
    }
  }
  main();
})();
</script>
</body>
